version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://gradeops:gradeops@db:5432/gradeops
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/artifacts:/app/artifacts
      - ./backend/logs:/app/logs
    depends_on:
      - db
    networks:
      - gradeops-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - gradeops-network
    environment:
      - VITE_API_URL=http://localhost:8000

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=gradeops
      - POSTGRES_PASSWORD=gradeops
      - POSTGRES_DB=gradeops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gradeops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradeops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  gradeops-network:
    driver: bridge
